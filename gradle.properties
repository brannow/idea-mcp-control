pluginGroup = com.github.brannow.phpstormmcp
pluginName = MCP Control
pluginVersion = 2026.2.3

platformType = PS
platformVersion = 2026.1.3

org.gradle.jvmargs = -Xmx2g

# Stops the Kotlin plugin from adding its OWN stdlib dependency. Note this does NOT keep the
# stdlib out of the shipped zip: ktor and the MCP SDK still pull kotlin-stdlib transitively, so
# lib/ contains kotlin-stdlib-<kotlinVersion>.jar regardless. Verify with:
#   unzip -l build/distributions/*.zip | grep lib/
kotlin.stdlib.default.dependency = false
