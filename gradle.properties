pluginGroup = com.github.brannow.phpstormmcp
pluginName = MCP Control
pluginVersion = 0.6.1

platformType = PS
platformVersion = 2026.1.3

org.gradle.jvmargs = -Xmx2g

# Don't bundle the Kotlin stdlib — the IntelliJ platform provides it.
# Bundling it risks conflicts with the platform's stdlib on older IDEs (we support down to 2025.3).
kotlin.stdlib.default.dependency = false
