name: Release

# Tags follow the PhpStorm line they serve: main tags 2026.x.y, the 2025.x branch tags 2025.3.x.
# The old 0.x tags still match the numeric pattern so historical tags keep working.
on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # The zip is built from gradle.properties, NOT from the tag. Without this check a tag that
      # disagrees with pluginVersion silently produces a mislabeled artifact -- and now that the
      # two branches use different version schemes (2026.x.y here, 2025.3.x on 2025.x), tagging
      # the wrong branch is an easy mistake to make. Fail loudly instead.
      - name: Check tag matches pluginVersion
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          TAG="${TAG#v}"
          PROP="$(sed -n 's/^pluginVersion *= *//p' gradle.properties | tr -d '[:space:]')"
          if [ "$TAG" != "$PROP" ]; then
            echo "::error::Tag '$TAG' does not match pluginVersion '$PROP' in gradle.properties."
            exit 1
          fi
          echo "version=$PROP" >> "$GITHUB_OUTPUT"
        id: version

      - name: Build and test
        run: ./gradlew build

      # Checks our bytecode against every IDE in the declared range, which is the same gate
      # Marketplace applies on upload. It catches API-policy problems that run fine but are not
      # allowed -- 2026.2.1 was rejected for PluginManagerCore.getPlugin, which is legal on 2026.1
      # and internal on 2026.2, while launching 2026.2 reported no issues at all.
      #
      # It does NOT prove the plugin starts: it never loads a class or exercises the bundled
      # libraries, which is how 0.7.0 passed and then failed to bind. Launching (runIde261/262)
      # covers that half. Neither check subsumes the other; a release needs both.
      - name: Verify plugin against the supported floor
        run: ./gradlew verifyPlugin

      - name: Build plugin zip
        run: ./gradlew buildPlugin

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.version }}
          files: build/distributions/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
