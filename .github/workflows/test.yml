name: Test

# 2025.x is the legacy line (PhpStorm 2025.1 - 2025.3) and is released independently of main,
# so it needs its own test runs -- a main-only trigger left it completely uncovered.
on:
  push:
    branches: [ main, '2025.x' ]
  pull_request:
    branches: [ main, '2025.x' ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build
