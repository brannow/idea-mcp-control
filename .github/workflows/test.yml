name: Test

# Both lines are released independently, so both need CI. For pull_request the workflow is taken
# from the base branch, so this list has to name 2025.x here too, not only on that branch.
on:
  push:
    branches: [ main, '2025.x' ]
  pull_request:
    branches: [ main, '2025.x' ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build
